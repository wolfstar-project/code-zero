<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Code Zero — the open-source autonomous engineer">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#8ee34a" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <radialGradient id="halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#8ee34a" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#8ee34a" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a1410" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#halo)" />

  <defs>
    <mask id="cutlogo" maskUnits="userSpaceOnUse"
          x="53.6" y="32" width="105.6" height="160">
      <rect x="53.6" y="32" width="105.6" height="160" fill="#fff"/>
      <g fill="#000"><rect x="46.4" y="105.411" width="120" height="13.178" transform="rotate(-62 106.4 112)"/></g>
    </mask>
    <clipPath id="cliplogo"><path d="M79.072,98.4A27.328,27.328 0 0 1 133.728,98.4L133.728,125.6A27.328,27.328 0 0 1 79.072,125.6Z"/></clipPath>
  </defs>
  <g mask="url(#cutlogo)" fill="none" stroke-width="9.28">
    <path class="ink-s" d="M106.4,76.64A21.76,21.76 0 0 1 128.16,98.4L128.16,125.6A21.76,21.76 0 0 1 84.64,125.6L84.64,98.4A21.76,21.76 0 0 1 106.4,76.64Z" stroke="#f3f7f1" stroke-opacity=".45" stroke-dasharray="0 1.672 20.546 27.235 20.546 51.125 20.546 27.235 20.546 1.672"/>
    <path class="ink-s" d="M106.4,76.64A21.76,21.76 0 0 1 128.16,98.4L128.16,125.6A21.76,21.76 0 0 1 84.64,125.6L84.64,98.4A21.76,21.76 0 0 1 106.4,76.64Z" stroke="#f3f7f1" stroke-dasharray="0 25.563 20.546 27.235 20.546 3.345 20.546 27.235 20.546 25.563"/>
  </g>
  <g class="acc" clip-path="url(#cliplogo)" fill="#8ee34a"><rect x="46.4" y="108.195" width="120" height="7.61" transform="rotate(-62 106.4 112)"/></g>
  <text x="155" y="123" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Code Zero</text>

  <text x="80" y="300" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750">The autonomous engineer</text>
  <text x="80" y="378" fill="#f3f7f1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="66" font-weight="750">that never merges a guess</text>

  <text x="80" y="452" fill="#9fb5a6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28">Finds, fixes, and verifies problems in pull requests.</text>

  <text x="80" y="540" fill="#8ee34a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="24">$ zero review --mode observe</text>
