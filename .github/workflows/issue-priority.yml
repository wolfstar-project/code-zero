name: Issue priority

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: issue-priority-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  set-priority:
    name: Set Priority field
    if: contains(github.event.issue.body, '### Priority')
    runs-on: ubuntu-latest
    permissions:
      issues: write # Sets the Priority field on the new issue.
    steps:
      - name: Copy the form answer to the native Priority field
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          PRIORITY_FIELD_ID: ${{ vars.PRIORITY_FIELD_ID }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The form puts Priority last, so the last heading is the form answer.
          priority=$(printf '%s\n' "$ISSUE_BODY" | tr -d '\r' | awk '
            /^### Priority$/ { found = 1; value = ""; next }
            found && NF && value == "" { value = $0 }
            END { print value }
          ')
          case "$priority" in
            "" | "_No response_" | "None")
              echo "The issue has no Priority answer."
              exit 0
              ;;
          esac

          field_id=$PRIORITY_FIELD_ID
          if [ -z "$field_id" ]; then
            if ! fields=$(gh api "orgs/$OWNER/issue-fields"); then
              echo "::error::The token cannot read the organization issue fields. Set the PRIORITY_FIELD_ID variable to the ID of the Priority field."
              exit 1
            fi
            field_id=$(jq '.[] | select(.name == "Priority") | .id' <<<"$fields")
            if [ -z "$field_id" ]; then
              echo "::error::The organization has no issue field named Priority."
              exit 1
            fi
          fi

          jq -n --argjson id "$field_id" --arg value "$priority" \
            '{issue_field_values: [{field_id: $id, value: $value}]}' |
            gh api --method POST "repos/$REPOSITORY/issues/$ISSUE_NUMBER/issue-field-values" --input -
          echo "Set Priority to $priority on issue #$ISSUE_NUMBER."
