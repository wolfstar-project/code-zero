name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

env:
  CI: 'true'

permissions:
  contents: read

jobs:
  lint:
    name: 🔠 Lint project
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🔠 Lint project
        run: aube run lint:ci

      - name: 🧭 Validate repository metadata and agent skills
        run: aube run check:repo

  typecheck:
    name: 🔎 Typecheck project
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🔎 Typecheck project
        run: aube run typecheck

  test:
    name: 🧪 Unit tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🧪 Unit tests
        run: aube run test

  build:
    name: 🏗️ Build project
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🏗️ Build project
        run: aube run build

      - name: 📦 Verify package version
        run: |
          node --input-type=module --eval "Promise.all([import('./packages/core/shared/dist/index.mjs'), import('./packages/core/shared/package.json', { with: { type: 'json' } })]).then(([built, pkg]) => { if (built.version !== pkg.default.version) { console.error('Injected version', built.version, 'does not match package.json version', pkg.default.version); process.exit(1) } })"

  knip:
    name: 🧹 Unused code check
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🧹 Check for unused code
        run: aube run knip

  i18n:
    name: 🌐 i18n validation
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup-toolchain

      - name: 🌐 Check for missing or dynamic i18n keys
        run: aube run i18n:report

      - name: 🌐 Check i18n schema is up to date
        run: |
          aube run i18n:schema
          git diff --exit-code packages/i18n/schemas packages/i18n/locales
