name: Deploy dashboard

# Publishes the managed cloud's dashboard to app.code-zero.dev as one Cloudflare Worker (see
# `apps/web/wrangler.jsonc`). Manual on purpose: a deploy changes what customers run, and applying
# the schema is a decision of its own, so each is chosen when the workflow is started.
#
# The Worker's own secrets (`NUXT_BETTER_AUTH_SECRET`, the model provider's key, mail) live on
# Cloudflare and are set once with `wrangler secret put`; this workflow never reads or sets them.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply database migrations before deploying
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Pinned so a deploy is reproducible; bump together with the compatibility date in wrangler.jsonc.
  WRANGLER_VERSION: 4.151.1

jobs:
  deploy:
    name: Deploy dashboard
    if: github.repository == 'wolfstar-project/code-zero'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    environment:
      name: dashboard
      url: https://app.code-zero.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build workspace dependencies
        run: aube exec turbo run build --filter='@code-zero/web^...'

      - name: Apply database migrations
        if: inputs.migrate
        working-directory: packages/database
        env:
          # The origin database, reached directly: Hyperdrive is for the Worker, not for migrations.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: aube run db:migrate

      - name: Build the Worker
        working-directory: apps/web
        env:
          VITEHUB_HOSTING: cloudflare
          NITRO_PRESET: cloudflare-module
          CODE_ZERO_BUILD_COMMIT: ${{ github.sha }}
          CODE_ZERO_BUILD_BRANCH: ${{ github.ref_name }}
          # Every dependency is inlined into the Worker bundle, which needs more than Node's default.
          NODE_OPTIONS: --max-old-space-size=6144
        run: aube exec nuxt build

      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config .output/server/wrangler.json
