name: Bug report
description: Report reproducible incorrect behavior
title: 'fix: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Code Zero. Do not include secrets or private repository content.
  - type: checkboxes
    id: existing
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `zero --version` or the commit SHA.
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent runtime
        - Runner
        - CLI
        - Dashboard
        - GitHub adapter
        - Configuration
        - Build or CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide deterministic steps, a small fixture, and sanitized output.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js and aube versions, runner mode, and relevant configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitized logs, screenshots, or related links.
