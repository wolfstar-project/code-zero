name: Setup toolchain
description: Setup pinned Node.js and aube versions with local caches

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 24.19.0
        package-manager-cache: false

    - name: Setup aube
      uses: jdx/aube-action@f82ca2f6c943dbde1904945d9f0ee1a0faf8e945 # v1.0.0
      with:
        version: 1.41.0

    - name: Verify package manager metadata
      shell: bash
      run: |
        expected="aube@$(aube --version | cut -d' ' -f1)"
        actual="$(node --print "require('./package.json').packageManager")"
        if [[ "$actual" != "$expected" ]]; then
          echo "package.json packageManager must be $expected, found $actual" >&2
          exit 1
        fi

    - name: Cache Turborepo
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-

    - name: Resolve aube store
      id: aube-store
      shell: bash
      run: echo "path=$(aube store path)" >> "$GITHUB_OUTPUT"

    - name: Cache aube store
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ${{ steps.aube-store.outputs.path }}
        key: ${{ runner.os }}-aube-store-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-aube-store-

    - name: Install dependencies
      shell: bash
      run: aube ci
